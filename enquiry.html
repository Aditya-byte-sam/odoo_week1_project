<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Admission Enquiry</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f9; margin: 40px; }
        .card { max-width: 450px; background: #fff; padding: 25px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin: 0 auto; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; background: #714B67; color: white; padding: 12px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div class="card">
    <h2>Student Admission Enquiry</h2>
    <form action="http://127.0.0.1:8069/api/external-enquiry" method="POST">
        
        <div class="form-group">
            <label>Full Name *</label>
            <input type="text" name="name" required placeholder="John Doe">
        </div>

        <div class="form-group">
            <label>Email Address *</label>
            <input type="email" name="email" required placeholder="john@example.com">
        </div>

        <div class="form-group">
            <label>Phone Number *</label>
            <input type="text" name="phone" required placeholder="+1234567890">
        </div>

        <div class="form-group">
            <label>Campus *</label>
            <select name="campus" required>
                <option value="">Select Campus</option>
                <option value="Main Campus">Main Campus</option>
                <option value="North Campus">North Campus</option>
            </select>
        </div>

        <div class="form-group">
            <label>Course *</label>
            <select name="course" required>
                <option value="">Select Course</option>
                <option value="Computer Science">Computer Science</option>
                <option value="Business Administration">Business Administration</option>
            </select>
        </div>

        <!-- Hidden fields for UTM tracking parameters -->
        <input type="hidden" id="utm_source" name="utm_source">
        <input type="hidden" id="utm_medium" name="utm_medium">
        <input type="hidden" id="utm_campaign" name="utm_campaign">
        <input type="hidden" id="landing_page_url" name="landing_page_url">

        <button type="submit">Submit Enquiry</button>
    </form>
</div>

<script>
    // Extract UTM parameters from URL query string dynamically
    window.onload = function() {
        const urlParams = new URLSearchParams(window.location.search);
        document.getElementById('utm_source').value = urlParams.get('utm_source') || '';
        document.getElementById('utm_medium').value = urlParams.get('utm_medium') || '';
        document.getElementById('utm_campaign').value = urlParams.get('utm_campaign') || '';
        document.getElementById('landing_page_url').value = window.location.href;
    };
</script>

</body>
</html>
